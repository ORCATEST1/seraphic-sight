name: Editorial release browser QA
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - src/**
      - scripts/editorial-browser-qa.mjs
      - .github/workflows/editorial-browser-qa.yml
jobs:
  verify-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: GENERATE_SOURCEMAP=false npm run build
        env:
          CI: 'true'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/editorial-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-release-screenshots
          path: browser-qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
